apiVersion: apps/v1
kind: Deployment
metadata: {name: delivery-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: delivery-api}
  template:
    metadata:
      labels: {app: delivery-api}
    spec:
      containers:
        - name: api
          image: delivery-api:PLACEHOLDER
          imagePullPolicy: Always
          ports: [{containerPort: 5000}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 3
